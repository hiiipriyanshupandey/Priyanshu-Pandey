<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certified Friend</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="certificate-page">

    <!-- Certificate (Only this will be downloaded) -->

    <div class="certificate" id="certificateCard">

        <div class="certificate-border">

            <div class="certificate-top">

                <h4>Certificate Of Friendship</h4>

            </div>

            <h1>CERTIFIED FRIEND</h1>

            <p class="certificate-text">

                This Certificate is Proudly Presented To

            </p>

            <div class="certificate-photo">

                <img id="certificatePhoto" src="" alt="Friend">

            </div>

            <h2 id="certificateName">

                Friend

            </h2>

            <p id="certificateMessage">

                Thank You For Being An Amazing Friend.

            </p>

            <div class="certificate-info">

                <div>

                    <span>Unique No.</span>

                    <strong id="certificateID">

                        FD-2026-1001

                    </strong>

                </div>

                <div>

                    <span>Awarded On</span>

                    <strong>

                        Friendship Day • 2026

                    </strong>

                </div>

            </div>

            <div class="certificate-sign">

                <div>

                    <div class="sign-line"></div>

                    <div class="sign-name">

                        Priyanshu

                    </div>

                    <div class="sign-role">

                        Best Wishes ❤️

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Buttons (Not included in certificate image) -->

    <div class="certificate-buttons">

        <button id="downloadCertificate">

            Download Certificate

        </button>

        <button id="continueBtn">

            Continue →

        </button>

    </div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="certificate.js"></script>

</body>

</html>
