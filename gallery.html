<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="background"></div>

<section class="gallery-page">

    <div class="top-bar">

        <button id="backBtn">
            ⬅ Back
        </button>

        <h2 id="friendName">
            Gallery
        </h2>

        <button id="fullscreenBtn">
            ⛶ Fullscreen
        </button>

    </div>

    <div class="viewer">

        <button
            class="nav-btn"
            id="prevBtn">

            ❮

        </button>

        <div id="mediaContainer">

        </div>

        <button
            class="nav-btn"
            id="nextBtn">

            ❯

        </button>

    </div>

    <div id="counter">

        1 / 1

    </div>

    <p id="mediaCaption">

    </p>

    <div class="slideshow-controls">

        <button id="playBtn">

            ▶ Play

        </button>

        <button id="pauseBtn">

            ⏸ Pause

        </button>

        <button id="letterBtn">

            💌 Letter

        </button>

    </div>

</section>

<script src="gallery-data.js"></script>

<script src="gallery.js"></script>

</body>

</html>
